# Action Chunking with Transformers (ACT) Configuration
# Dual UR10e Bimanual Robotic Handover Policy

dataset:
  hdf5_path: "data/handover_demos.hdf5"
  stats_path: "data/meta/stats.json"
  camera_names:
    - "top"
    - "wrist1"
    - "wrist2"
  # Target resize for uniform backbone feature extraction
  input_image_size: [112, 112]
  step_stride: 2          # Subsamples every 2nd step for efficient training

model:
  chunk_size: 50          # K=50 future action steps (1.00s at 50 Hz)
  state_dim: 14           # 14-DOF joint positions (qpos)
  action_dim: 14          # 14-DOF action vector
  d_model: 256            # Transformer hidden dimensionality
  nheads: 8               # Multi-head attention heads
  enc_layers: 3           # Transformer encoder layers
  dec_layers: 3           # Transformer decoder layers
  dim_feedforward: 1024   # Feedforward layer expansion
  latent_dim: 32          # C-VAE style latent dimension z
  backbone: "resnet18"    # Pretrained visual backbone
  freeze_backbone: false  # Fine-tune ResNet-18 with low differential LR for spatial precision
  dropout: 0.1
  use_goal_conditioning: true     # 3D centroid token [X_c, Y_c, Z_c]
  use_contact_conditioning: true  # Physical contact token [held_1, held_2]
  goal_dim: 3
  contact_dim: 2

training:
  batch_size: 32
  lr_backbone: 1.0e-5     # Low LR for visual feature extractor
  lr_transformer: 1.0e-4  # Standard LR for transformer layers
  weight_decay: 1.0e-4
  kl_weight: 10.0         # beta weight for KL divergence loss
  num_epochs: 25
  save_every: 5
  checkpoint_dir: "outputs/act_handover"
  seed: 42
  device: "auto"          # auto detects directml / cpu
